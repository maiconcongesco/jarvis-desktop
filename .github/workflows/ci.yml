name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  front:
    name: front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # setup-node traz npm 10; o package.json exige npm >=11.19 (engine-strict).
      - run: npm install -g npm@11.19.0
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    name: rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dependências do Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # generate_context! exige frontendDist; dist/ é gitignored e o job rust não roda npm build.
      - name: Stub frontendDist para cargo
        working-directory: .
        run: |
          mkdir -p dist
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><title>ci</title></head><body></body></html>' > dist/index.html
      - run: cargo test
      - run: cargo check
