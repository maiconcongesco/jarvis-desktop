name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    name: publish-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: npm 11.19 (engine-strict)
        run: npm install -g npm@11.19.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependências front
        run: npm ci --no-fund --no-audit

      - name: Build, assinar e publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Jarvis Desktop ${{ github.ref_name }}
          releaseBody: |
            Instalador NSIS (Windows) assinado com minisign do updater.
            Sem Authenticode na v1 — o SmartScreen pode avisar na primeira instalação.
            Atualizações in-app leem `latest.json` deste release.
          # Draft até o build verde; o agente publica com `gh release edit … --draft=false`.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
