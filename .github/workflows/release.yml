name: release

on:
  push:
    tags:
      - "v*"

# Deny-all por padrão; cada job concede apenas o necessário.
permissions: {}

jobs:
  publish-windows:
    name: publish-windows
    runs-on: windows-latest
    # contents: write só para criar o release (draft) e anexar os artefatos.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: npm 11.19 (engine-strict)
        run: npm install -g npm@11.19.0

      # SHA do branch stable (sem tag de versão); toolchain explícito pois não vem do ref.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Dependências front
        run: npm ci --no-fund --no-audit

      - name: Build, assinar e publicar
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Jarvis Desktop ${{ github.ref_name }}
          releaseBody: |
            Instalador NSIS (Windows) assinado com minisign do updater.
            Sem Authenticode na v1 — o SmartScreen pode avisar na primeira instalação.
            Atualizações in-app leem `latest.json` deste release.
          # Draft até o build verde; o agente publica com `gh release edit … --draft=false`.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          # tauri-action@v0 usa includeUpdaterJson (não uploadUpdaterJson).
          includeUpdaterJson: true
